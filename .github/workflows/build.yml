name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/DeviceHog.app build/DeviceHog.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceHog
          path: build/DeviceHog.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/DeviceHog.zip --title "$GITHUB_REF_NAME" --generate-notes
